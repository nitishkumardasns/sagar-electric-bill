<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sagar Electric Bill Generator</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2pdf for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* Hide everything except the invoice during printing (just in case) */
        @media print {
            body * { visibility: hidden; }
            #invoice-container, #invoice-container * { visibility: visible; }
            #invoice-container { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function App() {
            const invoiceRef = useRef();
            const [billNo, setBillNo] = useState('SE-002');
            const [date, setDate] = useState('11/10/20__');
            const [customerName, setCustomerName] = useState('');
            const [address, setAddress] = useState('');
            const [mobileNo, setMobileNo] = useState('');

            const [rows, setRows] = useState(
                Array.from({ length: 8 }).map((_, i) => ({ id: i + 1, desc: '', qty: '', rate: '', amount: 0 }))
            );

            const handleRowChange = (index, field, value) => {
                const newRows = [...rows];
                newRows[index][field] = value;
                
                if (field === 'qty' || field === 'rate') {
                    const qty = parseFloat(newRows[index].qty) || 0;
                    const rate = parseFloat(newRows[index].rate) || 0;
                    newRows[index].amount = qty * rate;
                }
                setRows(newRows);
            };

            const totalAmount = rows.reduce((sum, row) => sum + row.amount, 0);

            const handleDownloadPDF = () => {
                const element = invoiceRef.current;
                const opt = {
                    margin: 0,
                    filename: `Sagar_Electric_Bill_${billNo}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            };

            return (
                <div className="w-full max-w-4xl mx-auto flex flex-col gap-6">
                    {/* Action Bar (Not included in PDF) */}
                    <div className="flex justify-end p-4 bg-white shadow rounded-lg w-[210mm] mx-auto">
                        <button 
                            onClick={handleDownloadPDF}
                            className="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow flex items-center gap-2 transition-colors"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            Download PDF
                        </button>
                    </div>

                    {/* A4 Invoice Container */}
                    <div ref={invoiceRef} className="bg-white mx-auto text-black p-8 relative shadow-lg" style={{ width: '210mm', minHeight: '297mm' }}>
                        
                        {/* Header Details */}
                        <div className="flex justify-between items-center mb-6 text-sm font-bold">
                            <div className="border border-gray-400 rounded px-3 py-1 flex items-center">
                                <span>BILL NO:</span>
                                <input type="text" value={billNo} onChange={(e) => setBillNo(e.target.value)} className="ml-2 w-20 text-blue-600 outline-none font-bold bg-transparent" />
                            </div>
                            <div className="border border-gray-400 rounded px-3 py-1 flex items-center">
                                <span>DATE:</span>
                                <input type="text" value={date} onChange={(e) => setDate(e.target.value)} className="ml-2 w-28 text-blue-600 outline-none font-bold bg-transparent text-right" />
                            </div>
                        </div>

                        {/* Store Identity */}
                        <div className="border-2 border-black rounded-lg p-4 text-center relative mb-6">
                            <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-[#0b132b] text-white px-4 py-1 rounded-full text-xs font-bold tracking-widest uppercase">
                                Cash Memo
                            </div>
                            <div className="flex justify-center items-center gap-2 mt-2 mb-1">
                                <span className="text-blue-500 font-bold text-xl">~</span>
                                <div className="bg-[#0b132b] rounded-full w-10 h-10 flex items-center justify-center border-2 border-orange-400">
                                    <span className="text-orange-400 text-2xl font-bold">⚡</span>
                                </div>
                                <span className="text-blue-500 font-bold text-xl">~</span>
                            </div>
                            <h1 className="text-4xl font-extrabold tracking-wide mb-1 text-[#0b132b]">SAGAR ELECTRIC</h1>
                            <p className="text-blue-500 font-bold text-sm tracking-wide mb-2">ELECTRICAL GOODS • WIRING CONTRACTOR • PUMP SERVICES</p>
                            <p className="text-gray-700 text-sm">📍 201, Debaipurkur Road, Hindmotor, Hooghly - 712233</p>
                            <p className="text-gray-700 text-sm">📞 <span className="font-bold">Mobile:</span> 7980395426 &nbsp;|&nbsp; ✉️ <span className="font-bold">E-Mail:</span> showsagar001@gmail.com</p>
                        </div>

                        {/* Customer Details */}
                        <div className="border border-gray-400 rounded-lg p-4 mb-6 text-sm flex flex-col gap-3">
                            <div className="flex items-end">
                                <span className="font-bold whitespace-nowrap mr-2">Customer Name:</span>
                                <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="flex-grow border-b border-gray-400 outline-none border-dashed pb-1 bg-transparent" />
                            </div>
                            <div className="flex items-end">
                                <span className="font-bold whitespace-nowrap mr-2">Address:</span>
                                <input type="text" value={address} onChange={(e) => setAddress(e.target.value)} className="flex-grow border-b border-gray-400 outline-none border-dashed pb-1 bg-transparent" />
                            </div>
                            <div className="flex items-end">
                                <span className="font-bold whitespace-nowrap mr-2">Mobile No.:</span>
                                <input type="text" value={mobileNo} onChange={(e) => setMobileNo(e.target.value)} className="flex-grow border-b border-gray-400 outline-none border-dashed pb-1 bg-transparent" />
                            </div>
                        </div>

                        {/* Table */}
                        <div className="border-2 border-black rounded flex flex-col mb-12 relative overflow-hidden">
                            {/* Table Header */}
                            <div className="bg-[#1a202c] text-white flex font-bold text-sm text-center">
                                <div className="w-[8%] p-2 border-r border-gray-600">S.N.</div>
                                <div className="w-[50%] p-2 border-r border-gray-600">DESCRIPTION OF GOODS / SERVICES</div>
                                <div className="w-[12%] p-2 border-r border-gray-600">QTY</div>
                                <div className="w-[15%] p-2 border-r border-gray-600">RATE (₹)</div>
                                <div className="w-[15%] p-2">AMOUNT (₹)</div>
                            </div>
                            
                            {/* Table Rows */}
                            {rows.map((row, index) => (
                                <div key={row.id} className="flex text-sm border-b border-gray-300 last:border-b-0 group">
                                    <div className="w-[8%] p-2 border-r border-gray-300 text-center font-bold">{row.id}</div>
                                    <div className="w-[50%] p-1 border-r border-gray-300">
                                        <input type="text" value={row.desc} onChange={(e) => handleRowChange(index, 'desc', e.target.value)} className="w-full h-full outline-none px-1 bg-transparent" />
                                    </div>
                                    <div className="w-[12%] p-1 border-r border-gray-300">
                                        <input type="number" value={row.qty} onChange={(e) => handleRowChange(index, 'qty', e.target.value)} className="w-full h-full outline-none px-1 text-center bg-transparent" />
                                    </div>
                                    <div className="w-[15%] p-1 border-r border-gray-300">
                                        <input type="number" value={row.rate} onChange={(e) => handleRowChange(index, 'rate', e.target.value)} className="w-full h-full outline-none px-1 text-center bg-transparent" />
                                    </div>
                                    <div className="w-[15%] p-2 text-right font-semibold bg-gray-50 flex items-center justify-end">
                                        {row.amount.toFixed(2)}
                                    </div>
                                </div>
                            ))}

                            {/* Total Row */}
                            <div className="flex border-t-2 border-black bg-gray-50 font-bold text-sm">
                                <div className="w-[85%] p-2 text-right border-r border-gray-300">TOTAL AMOUNT:</div>
                                <div className="w-[15%] p-2 text-right text-blue-600">₹ {totalAmount.toFixed(2)}</div>
                            </div>
                        </div>

                        {/* Signatures */}
                        <div className="flex justify-between items-end mt-20 pt-10 text-sm font-bold">
                            <div className="text-center">
                                <div className="w-48 border-t border-dashed border-black pt-1">
                                    Customer Signature
                                </div>
                            </div>
                            <div className="text-center">
                                <div className="w-48 border-t border-dashed border-black pt-1">
                                    For SAGAR ELECTRIC
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
